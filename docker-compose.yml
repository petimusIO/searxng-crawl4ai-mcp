# SearXNG + Crawl4AI MCP - Truly Self-Hosted Search & Scrape Stack

services:

  # SearXNG - Open source metasearch engine (built with embedded config)
  searxng:
    build:
      context: .
      dockerfile: Dockerfile.searxng
    container_name: searxng
    ports:
      - "8081:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-$(openssl rand -hex 32)}
    # Configuration is baked into the image from ./searxng-settings.yml so
    # you no longer need to mount a host file at /etc/searxng/settings.yml.
    # If you do override via Coolify Persistent Storage, make sure you
    # mount a *file* (not a directory) to avoid startup failures.
    cap_drop:
      - ALL
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    cap_add:
      - CHOWN
    networks:
      - search-net
      - coolify
    restart: unless-stopped
    # Limit restart attempts in orchestrators that respect `deploy` so a
    # misconfiguration doesn't trigger infinite rebuild/restart churn.
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching
  redis:
    image: redis:alpine
    command: redis-server --save 30 1 --loglevel warning
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - search-net
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3

  # Headless browser pool for Spider (persistent Chrome instances)
  headless-browser:
    build:
      context: .
      dockerfile: Dockerfile.headless-browser
    container_name: headless-browser
    hostname: headless-browser
    ports:
      - "9222:9222"
      - "6000:6000"
    environment:
      - REMOTE_ADDRESS=0.0.0.0
      - HOSTNAME_OVERRIDE=headless-browser
    networks:
      - search-net
    restart: unless-stopped
    healthcheck:
      test: curl -sf http://localhost:6000/json/version || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
    cap_add:
      - SYS_ADMIN

  # Spider-scrape service (HTTP-only, Rust web scraper)
  spider-scrape:
    build:
      context: /home/triiq/projects/spider-scrape
      dockerfile: Dockerfile
    container_name: spider-scrape
    ports:
      - "8002:8002"
    environment:
      - RUST_LOG=info
    networks:
      - search-net
    restart: unless-stopped

  # Crawl4AI service for web scraping
  crawl4ai:
    build:
      context: .
      dockerfile: Dockerfile.crawl4ai
    container_name: crawl4ai
    ports:
      - "8001:8000"
    environment:
      - PROXY_URL=${PROXY_URL}
      - CRAWL4AI_LOG_LEVEL=INFO
    networks:
      - search-net
      - coolify
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs


  # MCP Server — orchestrates SearXNG + Crawl4AI, exposes MCP tools
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-server
    ports:
      - "3003:3003"
    environment:
      - SEARXNG_URL=http://searxng:8080
      - SPIDER_URL=http://spider-scrape:8002
      - CRAWL4AI_URL=http://crawl4ai:8000
      - MCP_HTTP_PORT=3003
      - MCP_INTERNAL_TOKEN=${MCP_INTERNAL_TOKEN:-}
      - LOG_LEVEL=info
    depends_on:
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_started
    networks:
      - search-net
      - coolify
    restart: unless-stopped

volumes:
  redis_data:

networks:
  search-net:
    driver: bridge
  coolify:
    external: true
# SearXNG Configuration — Maxed Out
use_default_settings: true
general:
  debug: false
  instance_name: "Seek Search"
  donation_url: false
  contact_url: false
  enable_stats: true

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "en"
  max_results: 50
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "change-this-secret-key-12345"
  base_url: "http://localhost:8081/"
  image_proxy: true
  http_protocol_version: "1.1"
  method: "POST"
  limiter: false
  # Don't rate-limit ourselves — we're the only consumer

ui:
  static_use_hash: false
  default_locale: "en"
  query_in_title: true
  infinite_scroll: false
  center_alignment: false
  cache_url: "https://web.archive.org/web/"
  default_theme: simple
  theme_args:
    simple_style: auto

outgoing:
  request_timeout: 5.0
  max_request_timeout: 8.0
  pool_connections: 200
  pool_maxsize: 50
  enable_http2: true
  useragent_suffix: ""
  proxies:
    all://:
      - "http://vnjkzfut:k2ul29u3o1t3@191.96.254.138:6185"
